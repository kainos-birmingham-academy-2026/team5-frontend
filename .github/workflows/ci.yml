name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  e2e:
    name: Playwright e2e (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Database-backed specs are tagged @database and excluded here.
      - run: npm run test:e2e:ci -- --project=chromium --project=api --project=bdd
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [build-lint-test, e2e]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Always build so PRs still prove the Dockerfile works.
      # Push only happens on main (login + tag + push steps below).
      - name: Build and tag image
        run: docker build -t team5-frontend:${{ github.sha }} -t team5-frontend:latest .
      - name: Confirm image tags
        run: docker images team5-frontend --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'

      - name: Log in to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_CLIENT_ID: ${{ secrets.ACR_CLIENT_ID }}
          ACR_CLIENT_SECRET: ${{ secrets.ACR_CLIENT_SECRET }}
        run: |
          REGISTRY="$(printf '%s' "$ACR_LOGIN_SERVER" | tr -d '\r\n' | sed -E 's#^https?://##; s#/$##')"
          USERNAME="$(printf '%s' "$ACR_CLIENT_ID" | tr -d '\r\n')"
          TOKEN="$(printf '%s' "$ACR_CLIENT_SECRET" | tr -d '\r\n')"
          echo "$TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin
          echo "ACR_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Tag and push to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${ACR_REGISTRY}/team5-frontend"
          docker tag team5-frontend:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag team5-frontend:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'
