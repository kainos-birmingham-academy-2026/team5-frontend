name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  e2e:
    name: Playwright e2e (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Database-backed specs are tagged @database and excluded here.
      - run: npm run test:e2e:ci -- --project=chromium --project=api --project=bdd
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [build-lint-test, e2e]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Always build so PRs still prove the Dockerfile works.
      # Push only happens on main (login + tag + push steps below).
      - name: Build and tag image
        run: docker build -t team5-frontend:${{ github.sha }} -t team5-frontend:latest .
      - name: Confirm image tags
        run: docker images team5-frontend --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'

      - name: Log in to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_CLIENT_ID }}
          password: ${{ secrets.ACR_CLIENT_SECRET }}

      - name: Tag and push to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/team5-frontend"
          docker tag team5-frontend:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag team5-frontend:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'
